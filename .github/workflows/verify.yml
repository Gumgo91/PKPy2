name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the package
        run: python -m pip install .
      - name: Run the quickstart example
        run: python examples/quickstart.py
      - name: Run the independent numerical validation
        run: python validation/numerical_validation.py
      - name: Run the event-record checks
        run: python validation/event_record_checks.py
